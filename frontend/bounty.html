<!doctype html>
<html lang="en">
<head>

  <title>Bounty workspace | Swarm-for-Hire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="product-overrides.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Swarm-for-Hire dashboard"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" role="img"><path d="M8 8 24 8M8 8 16 24M24 8 16 24"/><circle cx="8" cy="8" r="4"/><circle cx="24" cy="8" r="4"/><circle cx="16" cy="24" r="4"/></svg></span><span>SWARM<span class="accent">.</span>FOR<span class="accent">.</span>HIRE</span></a>
    <nav class="product-nav" aria-label="Product navigation"><a href="dashboard.html">Dashboard</a><a href="swarm.html">Swarm market</a></nav>
    <div class="top-meta"><span class="status-dot"></span><span id="mode-label">BOUNTY WORKSPACE</span><button type="button" class="wallet-btn" id="wallet-btn">Choose wallet</button></div>
  </header>
  <main class="product-page">
    <div class="page-toolbar"><a class="back-link" href="dashboard.html">← All bounties</a><span class="page-context">ON-CHAIN TASK / TESTNET</span></div>
    <section class="workspace bounty-workspace" aria-label="Bounty workspace">

      <section class="detail standalone-detail" id="detail"><div class="detail-empty detail-loading" role="status" aria-live="polite"><span class="big-mark">*</span><h2>Loading bounty.</h2><p>Reading live state from NEAR testnet…</p></div></section>
    </section>
    <div class="page-footer-actions"><button type="button" class="primary" id="create-btn">Back to dashboard <span>→</span></button><button type="button" class="text-btn" id="showcase-btn">Open swarm market <span>→</span></button><p class="microcopy" id="product-status">Live testnet workspace. Connect a wallet to settle a bounty.</p></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=20261113-12"></script>
